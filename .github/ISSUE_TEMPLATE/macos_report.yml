name: macOS test report
description: Tried it on a Mac? Tell us how it went, good or bad.
labels: [macos, testing]
body:
  - type: markdown
    attributes:
      value: |
        The macOS build compiles and passes tests in CI but has not run on a real Mac yet.
        Every report helps, including "it just worked".
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Everything worked
        - Partly worked
        - Did not work
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: "MacBook Air M2, macOS 15.3"
    validations:
      required: true
  - type: checkboxes
    id: steps
    attributes:
      label: What worked
      options:
        - label: The switcher started and showed a tray icon
        - label: The keychain prompt for "Claude Safe Storage" appeared once
        - label: It picked up the signed-in account and showed usage
        - label: Add account… worked
        - label: Switching accounts worked
        - label: Chats showed up on the other account
        - label: Start at login worked after a reboot
  - type: textarea
    id: notes
    attributes:
      label: Notes and log excerpt
      description: Anything odd, plus the relevant part of `switcher.log`. No tokens, please.
      render: text
