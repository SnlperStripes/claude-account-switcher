name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Compile native macOS view and test panel placement
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -swift-version 5 -parse-as-library -O native/Panel.swift -o "$RUNNER_TEMP/switcher-panel"
          "$RUNNER_TEMP/switcher-panel" --test-layout
