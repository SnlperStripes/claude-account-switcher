name: build

# Builds release binaries on version tags and by hand. Tests run in test.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            out: claude-account-switcher-windows-amd64.exe
            flags: -H=windowsgui -s -w
          - os: macos-latest
            out: claude-account-switcher-macos
            flags: -s -w
          - os: ubuntu-latest
            out: claude-account-switcher-linux-amd64
            goarch: amd64
            flags: -s -w
          - os: ubuntu-latest
            out: claude-account-switcher-linux-arm64
            goarch: arm64
            flags: -s -w
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Version info and a manifest make an unsigned exe look less like
      # malware to Windows Defender's machine learning.
      - name: Windows resources
        if: runner.os == 'Windows'
        shell: bash
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64 --product-version "$v.0" --file-version "$v.0"
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "${{ matrix.flags }}" -o dist/arm64 .
            CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "${{ matrix.flags }}" -o dist/amd64 .
            lipo -create -output "dist/${{ matrix.out }}" dist/arm64 dist/amd64
            rm dist/arm64 dist/amd64
          elif [ "$RUNNER_OS" = Linux ]; then
            CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.goarch }}" go build -ldflags "${{ matrix.flags }}" -o "dist/${{ matrix.out }}" .
          else
            go build -ldflags "${{ matrix.flags }}" -o "dist/${{ matrix.out }}" .
          fi
          cd dist && { sha256sum "${{ matrix.out }}" 2>/dev/null || shasum -a 256 "${{ matrix.out }}"; } > "${{ matrix.out }}.sha256"
      # Code signing through the SignPath Foundation, see CODE_SIGNING.md.
      # Only the Windows exe of a version tag, and only once the
      # SIGNPATH_API_TOKEN secret exists; until then releases stay unsigned.
      # The token is never put in an environment variable.
      - name: Check for code signing
        id: signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned exe
        id: unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.out }}
          path: dist/${{ matrix.out }}
      - name: Sign exe
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'claude-account-switcher' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Every release is approved by hand in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Check signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature "signed/${{ matrix.out }}"
          if ($s.Status -ne 'Valid') { throw "Signature is $($s.Status): $($s.StatusMessage)" }
          Write-Host "Signed by $($s.SignerCertificate.Subject)"
          Move-Item -Force "signed/${{ matrix.out }}" "dist/${{ matrix.out }}"
      - name: Checksum of the signed exe
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: cd dist && sha256sum "${{ matrix.out }}" > "${{ matrix.out }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true; gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.out }}" "dist/${{ matrix.out }}.sha256" --clobber
