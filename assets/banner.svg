<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Claude Account Switcher: switch the Claude desktop app between accounts. No email code, your chats come along.">
  <style>
    text { font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 36px; font-weight: 600; fill: #ECEEF0; letter-spacing: -0.3px; }
    .lead { font-size: 18px; fill: #9BA1A7; }
    .item { font-size: 14px; fill: #E3E5E8; }
    .dim { font-size: 13px; fill: #8D949B; }
    .check { font-size: 14px; fill: #E3E5E8; }
    .red { fill: #FF5A4F; }
  </style>

  <rect width="960" height="360" rx="20" fill="#0E1012"/>

  <!-- The mark: the tray ring, filled with the 5-hour usage of the active account. -->
  <g transform="translate(112 128)">
    <circle r="46" fill="none" stroke="#2C3136" stroke-width="16"/>
    <circle r="46" fill="none" stroke="#34C759" stroke-width="16" stroke-linecap="butt"
            pathLength="100" stroke-dasharray="42 100" transform="rotate(-90)"/>
    <circle r="15" fill="#34C759"/>
  </g>

  <text class="title" x="64" y="236">Claude Account Switcher</text>
  <text class="lead" x="64" y="274">Switch the Claude desktop app between accounts.</text>
  <text class="lead" x="64" y="300">No email code. Your chats come along.</text>

  <!-- Illustration of the tray menu. Names are placeholders. -->
  <g transform="translate(528 44)">
    <rect width="376" height="272" rx="10" fill="#1A1D20" stroke="#2A2F34"/>

    <text class="check" x="18" y="38">✓</text>
    <text class="item" x="40" y="38">Personal (Pro)</text>
    <text class="dim" x="358" y="38" text-anchor="end">5h 42% · week 18%</text>

    <text class="item" x="40" y="70">Work (Pro)</text>
    <text class="dim" x="358" y="70" text-anchor="end"><tspan class="red">5h 100% until 19:00</tspan> · week 47%</text>

    <line x1="12" y1="88" x2="364" y2="88" stroke="#2A2F34"/>

    <text class="check" x="18" y="116">✓</text>
    <text class="item" x="40" y="116">Auto-switch when nearly full</text>
    <text class="item" x="40" y="146">Auto-switch at</text>
    <text class="dim" x="358" y="146" text-anchor="end">96%  ›</text>
    <text class="item" x="40" y="176">Add account…</text>
    <text class="item" x="40" y="206">Import chats from all accounts</text>

    <line x1="12" y1="224" x2="364" y2="224" stroke="#2A2F34"/>

    <text class="check" x="18" y="252">✓</text>
    <text class="item" x="40" y="252">Start at login</text>
  </g>
</svg>
